<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe TV</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/static/icon/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon/apple-touch-icon.png">
<link href="/static/fonts/fonts.css" rel="stylesheet">
<link href="/static/shared.css" rel="stylesheet">
<style>
  :root { --accent: #9146ff; --fit: cover; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; font-family: "Outfit", system-ui, sans-serif; color: #fff; }
  body.preview { cursor: default; }
  video, #logoimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #logo, #logoimg { object-fit: var(--fit); transition: opacity .8s ease, filter .8s ease; }
  #logoimg { display: none; }
  .dim { opacity: .25; filter: blur(8px) saturate(1.4); }
  .dim.deep { opacity: .12; filter: blur(14px) saturate(1.6); }
  /* a plain black veil: what lite mode uses instead of blurring the video */
  #shade { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  #clip { opacity: 0; transition: opacity .5s ease; object-fit: contain; }
  #clip.show { opacity: 1; }
  .layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ── Shoutout card ────────────────────────────────────────────── */
  #card { opacity: 0; transform: scale(.85); transition: opacity .6s ease, transform .6s cubic-bezier(.2,1.4,.4,1); flex-direction: column; gap: 2.6vh; }
  #card.show { opacity: 1; transform: scale(1); }
  .ring { position: relative; width: 34vh; height: 34vh; border-radius: 50%; padding: 1.2vh; background: conic-gradient(#ff3b3b, #ff9f1c, #ffe14d, #3ddc84, #3ba7ff, #9146ff, #ff3b3b); animation: spin 6s linear infinite; box-shadow: 0 0 8vh var(--accent); will-change: transform; }
  .ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #111; border: 1vh solid #000; animation: spin 6s linear infinite reverse; }
  /* GO FOLLOW: big enough to read from across the room */
  .kicker { font-family: "Bungee", sans-serif; font-size: 9vh; line-height: 1; letter-spacing: .1em; color: var(--accent); text-shadow: 0 0 4vh var(--accent), 0 .7vh 0 rgba(0,0,0,.55); }
  .name { font-weight: 900; font-size: 11vh; line-height: 1; text-align: center; text-shadow: 0 .6vh 0 rgba(0,0,0,.6); max-width: 90vw; overflow-wrap: anywhere; }
  .sub { font-size: 4vh; opacity: .9; text-align: center; }
  .url { font-family: "Bungee", sans-serif; font-size: 3.2vh; padding: 1vh 3vh; border-radius: 99px; background: rgba(0,0,0,.55); border: .4vh solid var(--accent); }

  /* ── Raid ─────────────────────────────────────────────────────── */
  #raid { visibility: hidden; }
  #raid.go { visibility: visible; }
  #raid .flash { position: absolute; inset: 0; background: radial-gradient(circle, #fff 0%, var(--accent) 45%, transparent 75%); opacity: 0; }
  #raid.go .flash { animation: flash .7s ease-out both; }
  #raid .glow { position: absolute; inset: -20%; background: radial-gradient(circle at var(--px, 30%) var(--py, 62%), rgba(145,70,255,.5) 0%, transparent 45%);
    background: radial-gradient(circle at var(--px, 30%) var(--py, 62%), color-mix(in srgb, var(--accent) 55%, transparent) 0%, transparent 45%); opacity: 0; }
  #raid.go .glow { animation: fadein .8s .9s ease both, breathe 2.4s 1.7s ease-in-out infinite alternate; }

  .hazard { position: absolute; left: -5vw; right: -5vw; height: 7vh; background: #0b0b10; display: flex; align-items: center; overflow: hidden; box-shadow: 0 0 4vh rgba(0,0,0,.8); will-change: transform; }
  .hazard::before, .hazard::after { content: ""; position: absolute; left: 0; right: 0; height: 1.3vh; background: repeating-linear-gradient(-45deg, var(--accent) 0 1.6vh, #0b0b10 1.6vh 3.2vh); }
  .hazard::before { top: 0; } .hazard::after { bottom: 0; }
  .hazard.top { top: 5vh; transform: rotate(-2deg) translateX(-110%); }
  .hazard.bot { bottom: 5vh; transform: rotate(-2deg) translateX(110%); }
  #raid.go .hazard.top { animation: tapeTop .55s .05s cubic-bezier(.2,1.2,.4,1) both; }
  #raid.go .hazard.bot { animation: tapeBot .55s .15s cubic-bezier(.2,1.2,.4,1) both; }
  .tape { display: flex; white-space: nowrap; font-family: "Bungee", sans-serif; font-size: 3vh; letter-spacing: .3em; color: var(--accent); text-shadow: 0 0 2vh var(--accent); animation: marquee 9s linear infinite; will-change: transform; }
  .hazard.bot .tape { animation-direction: reverse; }
  .tape span { padding-right: 3vw; }

  .wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1vh; }
  #raid.out .wrap { animation: collapse .9s cubic-bezier(.6,0,.9,.4) both; }
  #raid.out .hazard.top { animation: tapeOutL .6s ease-in both; }
  #raid.out .hazard.bot { animation: tapeOutR .6s ease-in both; }
  #raid.out .glow { animation: flareout .9s ease-in both; }
  .stage { display: flex; flex-direction: column; align-items: center; }
  #raid.go .stage { animation: shake .9s .45s linear both; }

  .title { display: flex; gap: 1vw; font-family: "Bungee", sans-serif; font-size: 21vh; line-height: .9; }
  .title span { display: inline-block; opacity: 0; color: #fff; will-change: transform, opacity;
    text-shadow: -.7vh 0 #ff2a6d, .7vh 0 #05d9e8, 0 0 5vh var(--accent); }
  /* each letter's delays are set inline, so any title text works */
  #raid.go .title span { animation: slam .5s cubic-bezier(.2,1.6,.5,1) both, glitch 3.2s 2s steps(1) infinite; }

  .row { display: flex; align-items: center; gap: 5vw; margin-top: 2vh; }
  .portal { position: relative; width: 36vh; height: 36vh; flex: none; opacity: 0; will-change: transform; }
  #raid.go .portal { animation: portalIn .7s .95s cubic-bezier(.2,1.5,.4,1) both; }
  .portal .orbit { position: absolute; inset: -2.2vh; border-radius: 50%; border: .5vh dashed var(--accent); animation: spin 5s linear infinite; filter: drop-shadow(0 0 1.2vh var(--accent)); will-change: transform; }
  .portal .orbit.o2 { inset: -4.4vh; border: .35vh dotted #fff; opacity: .6; animation-duration: 9s; animation-direction: reverse; }
  .portal .rim { position: absolute; inset: 0; border-radius: 50%; padding: 1vh; will-change: transform;
    background: conic-gradient(from 0deg, var(--accent), #fff, var(--accent), #ff2a6d, var(--accent)); animation: spin 2.2s linear infinite; box-shadow: 0 0 8vh var(--accent), inset 0 0 4vh #000; }
  .portal img { position: absolute; inset: 1vh; width: calc(100% - 2vh); height: calc(100% - 2vh); border-radius: 50%; object-fit: cover; background: #111; clip-path: circle(0% at 50% 50%); }
  #raid.go .portal img { animation: iris .6s 1.15s cubic-bezier(.3,1.3,.5,1) both; }
  .shock { position: absolute; inset: 0; border-radius: 50%; border: 1vh solid var(--accent); opacity: 0; }
  #raid.go .shock { animation: shock .9s 1.0s ease-out both; }
  #raid.go .shock.s2 { animation-delay: 1.2s; border-color: #fff; }

  .info { display: flex; flex-direction: column; align-items: flex-start; max-width: 52vw; }
  .rname { font-weight: 900; font-size: 11vh; line-height: 1; white-space: nowrap; opacity: 0;
    text-shadow: 0 .6vh 0 rgba(0,0,0,.6), 0 0 4vh var(--accent); }
  #raid.go .rname { animation: slideIn .6s 1.45s cubic-bezier(.2,1.3,.4,1) both, nameGlitch .35s 1.45s steps(2) 2; }
  .rsub { font-size: 3.6vh; opacity: 0; margin-top: 1.4vh; letter-spacing: .04em; }
  #raid.go .rsub { animation: fadeUp .5s 1.75s ease both; }
  .rcount { display: flex; align-items: baseline; gap: 1.6vh; margin-top: .6vh; opacity: 0; }
  #raid.go .rcount { animation: fadeUp .5s 1.95s ease both; }
  .rcount b { font-family: "Bungee", sans-serif; font-size: 15vh; line-height: 1; color: var(--accent);
    text-shadow: 0 0 4vh var(--accent), 0 .6vh 0 rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
  /* grows to the left, into empty space, not over the RAIDERS label */
  .rcount b.pop { animation: pop .45s cubic-bezier(.2,2,.4,1); transform-origin: 100% 60%; }
  .rcount span { font-family: "Bungee", sans-serif; font-size: 4.4vh; letter-spacing: .12em; }

  /* ── Follow ───────────────────────────────────────────────────── */
  #follow { flex-direction: column; gap: 3.5vh; visibility: hidden; }
  #follow.go { visibility: visible; }
  .fav { position: relative; width: 36vh; height: 36vh; opacity: 0; will-change: transform; }
  #follow.go .fav { animation: popIn .7s .1s cubic-bezier(.2,1.6,.4,1) both; }
  .fav .halo { position: absolute; inset: -2.4vh; border-radius: 50%; border: .8vh solid var(--accent); box-shadow: 0 0 6vh var(--accent), inset 0 0 3vh var(--accent); }
  #follow.go .fav .halo { animation: heartbeat 1.1s .9s ease-in-out infinite; }
  .fav img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #111; border: 1vh solid #000; }
  .fav .heart { position: absolute; right: -1vh; bottom: 1vh; width: 11vh; height: 11vh; opacity: 0; filter: drop-shadow(0 .6vh 1.2vh rgba(0,0,0,.6)); }
  #follow.go .fav .heart { animation: heartPop .6s .75s cubic-bezier(.2,2,.4,1) both; }
  .thanks { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 2.4vw; max-width: 92vw; font-family: "Bungee", sans-serif; font-size: 10vh; line-height: 1.05; text-align: center; }
  .thanks span { display: inline-block; opacity: 0; color: #fff; text-shadow: 0 0 4vh var(--accent), 0 .7vh 0 rgba(0,0,0,.55); will-change: transform, opacity; }
  .thanks span.hl { color: var(--accent); text-shadow: 0 0 4vh var(--accent), 0 .7vh 0 rgba(0,0,0,.55); }
  #follow.go .thanks span { animation: wordUp .6s cubic-bezier(.2,1.5,.4,1) both; }
  .fname { font-weight: 900; font-size: 7vh; line-height: 1; opacity: 0; white-space: nowrap; text-shadow: 0 .5vh 0 rgba(0,0,0,.6); }
  #follow.go .fname { animation: fadeUp .5s 1.15s ease both; }
  #follow.out, #gift.out { transition: opacity .6s ease, transform .6s ease; opacity: 0; transform: scale(.94); }
  /* the same card is used for follows, subs, resubs and bits */
  .fav .badge { display: none; }
  #follow[data-kind="follow"] .fav .heart { display: block; }
  #follow:not([data-kind="follow"]) .fav .heart { display: none; }
  #follow[data-kind="sub"] .fav .star, #follow[data-kind="resub"] .fav .star, #follow[data-kind="bits"] .fav .gem { display: block; }
  .fav .badge { position: absolute; right: -1vh; bottom: 1vh; width: 11vh; height: 11vh; opacity: 0; filter: drop-shadow(0 .6vh 1.2vh rgba(0,0,0,.6)); }
  #follow.go .fav .badge { animation: heartPop .6s .75s cubic-bezier(.2,2,.4,1) both; }
  .hsub { font-size: 4vh; opacity: 0; text-align: center; max-width: 85vw; }
  #follow.go .hsub { animation: fadeUp .5s 1.3s ease both; }
  .hmsg { max-width: 70vw; padding: 1.6vh 3vh; border-radius: 2.5vh; background: rgba(0,0,0,.6); border: .4vh solid var(--accent);
    font-size: 3.4vh; line-height: 1.25; text-align: center; overflow-wrap: anywhere; opacity: 0; }
  #follow.go .hmsg { animation: fadeUp .5s 1.5s ease both; }
  .hsub:empty, .hmsg:empty { display: none; }
  #follow[data-kind="resub"] .thanks, #follow[data-kind="bits"] .thanks, #follow[data-kind="tiktok_gift"] .thanks { font-size: 12vh; }
  /* TikTok gifts: the gift's own picture as the badge (a gem if it has none) */
  #follow[data-kind="tiktok_gift"] .fav .giftimg { display: block; object-fit: contain; }
  #follow[data-kind="tiktok_gift"][data-noimg] .fav .giftimg { display: none; }
  #follow[data-kind="tiktok_gift"][data-noimg] .fav .gem { display: block; }
  /* alerts from TikTok get a small tag under the name */
  .ptag { display: none; padding: .6vh 2vh; border-radius: 99px; font: 700 2.6vh "Outfit", sans-serif; letter-spacing: .08em;
    background: #000; border: .3vh solid #fff; box-shadow: -.4vh 0 0 #25f4ee, .4vh 0 0 #fe2c55; opacity: 0; }
  .ptag.on { display: block; }
  #follow.go .ptag { animation: fadeUp .5s 1.25s ease both; }
  #follow:not([data-kind="follow"]) { gap: 2.6vh; }
  #follow:not([data-kind="follow"]) .fav { width: 30vh; height: 30vh; }

  /* ── Tier 2 and Tier 3 subs: the same card, bigger ────────────────── */
  #follow .beams, #follow .tierslam, .fav .crown, .fav .star2 { display: none; }
  #follow[data-tier="2"] .fav .star2, #follow[data-tier="3"] .fav .star2 { display: block; }
  .fav .star2 { position: absolute; right: 7.5vh; bottom: -1.8vh; width: 8.5vh; height: 8.5vh; opacity: 0; filter: drop-shadow(0 .6vh 1.2vh rgba(0,0,0,.6)); }
  #follow.go .fav .star2 { animation: heartPop .6s 1s cubic-bezier(.2,2,.4,1) both; }
  #follow[data-tier="2"] .fav .halo { box-shadow: 0 0 0 1.1vh rgba(222,228,255,.9), 0 0 7vh var(--accent), inset 0 0 3vh var(--accent); }
  #follow.go[data-tier="2"] .fav, #follow.go[data-tier="3"] .fav { animation: popIn .7s .1s cubic-bezier(.2,1.6,.4,1) both, shake .7s .8s linear; }
  .tierslam { display: none; gap: .8vw; font-family: "Bungee", sans-serif; line-height: 1; letter-spacing: .1em; }
  .tierslam span { display: inline-block; opacity: 0; will-change: transform, opacity; }
  #follow[data-tier] .tierslam { display: flex; }
  #follow[data-tier="2"] .tierslam { font-size: 8vh; color: #e4e8ff; text-shadow: 0 0 3vh #aab4ff, 0 .6vh 0 rgba(0,0,0,.5); }
  #follow[data-tier="3"] .tierslam { font-size: 12vh; }
  #follow[data-tier="3"] .tierslam span { background: linear-gradient(#fff7c2, #ffc93c 48%, #d98a0b); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 2.5vh rgba(255,200,60,.75)) drop-shadow(0 .6vh 0 rgba(0,0,0,.5)); }
  #follow.go[data-tier] .tierslam span { animation: slam .5s cubic-bezier(.2,1.6,.5,1) both; }
  /* Tier 3: spotlights, a gold ring and a crown */
  #follow[data-tier="3"] .fav { width: 26vh; height: 26vh; margin-top: 7vh; }
  #follow[data-tier="3"] .fav .halo { border-color: #ffc93c; box-shadow: 0 0 0 1.1vh rgba(255,214,90,.85), 0 0 9vh #ffb800, inset 0 0 3vh #ffc93c; }
  #follow[data-tier="3"] .thanks { font-size: 8.5vh; }
  #follow[data-tier="3"] .fav .crown { display: block; }
  .fav .crown { position: absolute; left: 50%; top: -11.5vh; width: 17vh; margin-left: -8.5vh; opacity: 0; filter: drop-shadow(0 1vh 1.6vh rgba(0,0,0,.55)); }
  #follow.go[data-tier="3"] .fav .crown { animation: crownDrop .8s 1.3s cubic-bezier(.3,1.5,.5,1) both; }
  #follow .beams { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #follow[data-tier="3"] .beams { display: block; }
  .beams i { position: absolute; bottom: -8vh; left: 50%; width: 46vw; height: 140vh; margin-left: -23vw; transform-origin: 50% 100%; opacity: 0;
    background: linear-gradient(to top, rgba(255,214,90,.42), rgba(255,214,90,0) 82%); clip-path: polygon(46% 100%, 54% 100%, 100% 0, 0 0); }
  #follow.go .beams i:nth-child(1) { animation: fadein .6s .1s both, beamL 3.2s .1s ease-in-out infinite alternate; }
  #follow.go .beams i:nth-child(2) { animation: fadein .6s .1s both, beamR 3.2s .1s ease-in-out infinite alternate; }

  /* ── Watch streak: a fuse of dots, a ring of fire ─────────────────── */
  #streak { flex-direction: column; gap: 2.4vh; visibility: hidden; }
  #streak.go { visibility: visible; }
  .sav { position: relative; width: 28vh; height: 28vh; opacity: 0; }
  #streak.go .sav { animation: popIn .7s .1s cubic-bezier(.2,1.6,.4,1) both; }
  .sav .fire { position: absolute; inset: -2.6vh; border-radius: 50%; background: conic-gradient(#ff3b00, #ffb000, #ff6a00, #ffe14d, #ff2a00, #ff9500, #ff3b00);
    animation: spin 2.2s linear infinite, flicker .18s steps(2) infinite; box-shadow: 0 0 7vh #ff6a00, 0 0 2vh #ffb000; will-change: transform; }
  .sav img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #111; border: 1vh solid #000; }
  .sdots { display: flex; align-items: center; gap: 1.6vh; min-height: 5vh; }
  .sdots i { width: 4.4vh; height: 4.4vh; border-radius: 50%; background: rgba(255,255,255,.14); border: .4vh solid rgba(255,255,255,.25); }
  #streak.go .sdots i { animation: dotLit .45s cubic-bezier(.2,2,.4,1) both; }
  .sdots b { font-family: "Bungee", sans-serif; font-size: 3.6vh; color: #ffb000; opacity: 0; }
  #streak.go .sdots b { animation: fadeUp .4s both; }
  #streak .thanks span.hl { color: #ffb000; text-shadow: 0 0 4vh #ff6a00, 0 .7vh 0 rgba(0,0,0,.55); }
  #streak.go .thanks span, #mod.go .thanks span { animation: wordUp .6s cubic-bezier(.2,1.5,.4,1) both; }
  #streak.go .fname, #mod.go .fname { animation: fadeUp .5s 1.2s ease both; }
  #streak.go .hsub, #mod.go .hsub { animation: fadeUp .5s 1.4s ease both; }
  #streak.go .hmsg { animation: fadeUp .5s 1.6s ease both; }
  #streak.out, #mod.out, #giga.out { transition: opacity .6s ease, transform .6s ease; opacity: 0; transform: scale(.94); }

  /* ── Modiversary: a sword slash, crossed swords, a shield ─────────── */
  #mod { flex-direction: column; gap: 2vh; visibility: hidden; }
  #mod.go { visibility: visible; }
  #mod .slash { position: absolute; left: 50%; top: 50%; width: 160vw; height: 1.1vh; margin: -.55vh 0 0 -80vw; border-radius: 99px; opacity: 0;
    background: linear-gradient(90deg, transparent, #fff 20%, #fff 80%, transparent); box-shadow: 0 0 3vh #fff, 0 0 8vh var(--accent); transform: rotate(-24deg) scaleX(0); }
  #mod.go .slash { animation: slash .55s .05s cubic-bezier(.2,.9,.3,1) both; }
  #mod .slashflash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #mod.go .slashflash { animation: flash .5s .2s ease-out both; }
  .crest { position: relative; width: 46vh; height: 46vh; display: flex; align-items: center; justify-content: center; }
  #mod.go .crest { animation: shake .5s 1.05s linear; }
  .crest .sword { position: absolute; left: 50%; top: 50%; width: 11vh; height: 64vh; margin: -32vh 0 0 -5.5vh; opacity: 0; filter: drop-shadow(0 1vh 1.5vh rgba(0,0,0,.6)); will-change: transform; }
  #mod.go .sword.s1 { animation: swordInL .6s .55s cubic-bezier(.3,1.4,.5,1) both; }
  #mod.go .sword.s2 { animation: swordInR .6s .7s cubic-bezier(.3,1.4,.5,1) both; }
  #mod.out .sword.s1 { animation: swordOutL .55s ease-in both; }
  #mod.out .sword.s2 { animation: swordOutR .55s ease-in both; }
  .crest .shield { position: relative; width: 26vh; height: 31vh; opacity: 0; }
  #mod.go .shield { animation: popIn .6s .3s cubic-bezier(.2,1.6,.4,1) both; }
  .crest .shield svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 0 3vh var(--accent)); }
  .crest .shield img { position: absolute; left: 50%; top: 4.6vh; width: 17vh; height: 17vh; margin-left: -8.5vh; border-radius: 50%; object-fit: cover; background: #111; border: .9vh solid #000; box-shadow: 0 0 0 .6vh var(--accent); }
  .crest .modbadge { position: absolute; right: 7vh; bottom: 6vh; width: 9vh; height: 9vh; opacity: 0; filter: drop-shadow(0 .6vh 1vh rgba(0,0,0,.6)); }
  #mod.go .modbadge { animation: heartPop .6s 1.25s cubic-bezier(.2,2,.4,1) both; }
  #mod .thanks span.hl { color: var(--accent); }

  /* ── Gigantified emote ────────────────────────────────────────────── */
  #giga { visibility: hidden; }
  #giga.go { visibility: visible; }
  #giga .gbox { position: relative; display: flex; align-items: center; justify-content: center; height: 66vh; }
  #gigaimg { height: 62vh; max-width: 90vw; object-fit: contain; filter: drop-shadow(0 2vh 4vh rgba(0,0,0,.6)); opacity: 0; will-change: transform; }
  #giga.go #gigaimg, #giga.go .gtext { animation: gigaIn .7s .15s cubic-bezier(.2,1.6,.4,1) both, wobble 1.6s .9s ease-in-out infinite; }
  #giga.out #gigaimg, #giga.out .gtext { animation: gigaOut .55s ease-in both; }
  #giga .gtext { display: none; font-family: "Bungee", sans-serif; font-size: 22vh; line-height: 1; color: #fff; text-align: center; max-width: 92vw; overflow-wrap: anywhere;
    text-shadow: 0 0 5vh var(--accent), 0 1vh 0 rgba(0,0,0,.6); opacity: 0; }
  #giga.textonly #gigaimg { display: none; }
  #giga.textonly .gtext { display: block; }
  #giga .gshock { position: absolute; left: 50%; top: 50%; width: 40vh; height: 40vh; margin: -20vh 0 0 -20vh; border-radius: 50%; border: 1vh solid var(--accent); opacity: 0; }
  #giga.go .gshock { animation: shock .9s .35s ease-out both; }
  #giga.go .gshock.s2 { animation-delay: .55s; border-color: #fff; }
  .gcap { position: absolute; left: 50%; bottom: 5vh; transform: translateX(-50%); display: flex; align-items: center; gap: 1.6vh; padding: 1.2vh 3vh 1.2vh 1.2vh;
    border-radius: 99px; background: rgba(0,0,0,.72); border: .4vh solid var(--accent); white-space: nowrap; opacity: 0; }
  #giga.go .gcap { animation: capUp .5s .7s ease both; }
  .gcap img { width: 7vh; height: 7vh; border-radius: 50%; object-fit: cover; background: #111; }
  .gcap span { font-family: "Bungee", sans-serif; font-size: 3.6vh; letter-spacing: .04em; }

  /* ── Text to speech: what's being read, top-left (when it's routed to the TV) ── */
  #ttsbox { position: absolute; top: 4vh; left: 3vw; z-index: 20; display: none; align-items: flex-start; gap: 1.6vh; max-width: 44vw;
    padding: 1.6vh 2.8vh 1.6vh 2vh; border-radius: 2.6vh; background: rgba(10, 8, 18, .85); border: .4vh solid var(--tc, #9146ff);
    box-shadow: 0 0 3vh color-mix(in srgb, var(--tc, #9146ff) 45%, transparent); pointer-events: none; }
  #ttsbox.on { display: flex; animation: popIn .35s cubic-bezier(.2,1.5,.4,1) both; }
  #ttsbox .tspk { flex: none; width: 4.6vh; height: 4.6vh; color: var(--tc, #9146ff); animation: breathe .6s ease-in-out infinite alternate; }
  #ttsbox .tspk svg { width: 100%; height: 100%; display: block; }
  #ttsbox b { display: block; font-family: "Bungee", sans-serif; font-weight: 400; font-size: 2.4vh; letter-spacing: .05em; color: var(--tc, #9146ff); }
  #ttsbox .tbody span { font-size: 3.2vh; line-height: 1.25; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  body.lite #ttsbox { box-shadow: none; }

  /* ── First-time chatter: corner pop-ups, stacked top-right ─────── */
  #welcomes { position: absolute; top: 4vh; right: 3vw; display: flex; flex-direction: column; align-items: flex-end; gap: 1.6vh; pointer-events: none; z-index: 20; }
  .wtoast { display: flex; align-items: center; gap: 1.8vh; padding: 1.4vh 3.2vh 1.4vh 1.4vh; border-radius: 99px; max-width: 46vw;
    background: rgba(10,8,18,.82); border: .4vh solid var(--wc, var(--accent)); box-shadow: 0 0 3vh var(--wc, var(--accent));
    animation: toastIn .55s cubic-bezier(.2,1.5,.4,1) both; }
  .wtoast.bye { animation: toastOut .45s ease-in both; }
  .wtoast img { width: 9vh; height: 9vh; border-radius: 50%; object-fit: cover; flex: none; border: .4vh solid var(--wc, var(--accent)); background: #111; }
  .wtoast .wt { font-family: "Bungee", sans-serif; font-size: 2.6vh; color: var(--wc, var(--accent)); letter-spacing: .06em; }
  .wtoast .wn { font-size: 4vh; font-weight: 900; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wtoast .ws { font-size: 2.3vh; opacity: .8; }
  .wtoast > div { min-width: 0; }
  .wave { display: inline-block; transform-origin: 70% 70%; animation: wave 1.2s .4s ease-in-out 2; }

  /* ── Hype train: bar along the bottom + banner ─────────────────── */
  #hype { position: absolute; left: 3vw; right: 3vw; bottom: 2.5vh; height: 8vh; display: flex; align-items: center; gap: 2vh; z-index: 15;
    padding: 0 2.4vh; border-radius: 99px; background: rgba(10,8,18,.85); border: .35vh solid var(--hc, #9146ff);
    box-shadow: 0 0 3vh color-mix(in srgb, var(--hc, #9146ff) 60%, transparent);
    transform: translateY(14vh); opacity: 0; transition: transform .6s cubic-bezier(.2,1.3,.4,1), opacity .4s ease; pointer-events: none; }
  #hype.on { transform: none; opacity: 1; }
  body.raiding #hype.on { opacity: 0; transform: translateY(14vh); }
  #hype .htitle { font-family: "Bungee", sans-serif; font-size: 3vh; letter-spacing: .08em; white-space: nowrap; }
  #hype .htrain { font-size: 4vh; line-height: 1; }
  #hype .hlevel { font-family: "Bungee", sans-serif; font-size: 2.6vh; padding: .6vh 1.6vh; border-radius: 99px; background: var(--hc, #9146ff); color: #fff; white-space: nowrap; }
  #hype .htrack { position: relative; flex: 1; height: 3.2vh; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
  #hype .hfill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; transition: width 1.2s cubic-bezier(.2,1,.3,1);
    background: repeating-linear-gradient(-45deg, var(--hc, #9146ff) 0 2vh, color-mix(in srgb, var(--hc, #9146ff) 70%, #fff) 2vh 4vh);
    background-size: 5.66vh 100%; animation: stripes .8s linear infinite; }
  #hype.unknown .hfill { width: 100% !important; opacity: .55; }
  #hype .hpct { font-family: "Bungee", sans-serif; font-size: 2.8vh; min-width: 8vh; text-align: right; }
  /* a dark band behind the words keeps them readable over any logo */
  #hypebanner { position: absolute; left: 0; right: 0; top: 32vh; text-align: center; z-index: 16; pointer-events: none;
    font-family: "Bungee", sans-serif; font-size: 13vh; line-height: 1.05; color: #fff; padding: 3.5vh 6vw;
    background: linear-gradient(90deg, transparent, rgba(8,6,16,.88) 18%, rgba(8,6,16,.88) 82%, transparent);
    border-top: .4vh solid var(--hc, #9146ff); border-bottom: .4vh solid var(--hc, #9146ff);
    text-shadow: 0 0 4vh var(--hc, #9146ff), 0 .8vh 0 rgba(0,0,0,.6); opacity: 0; }
  #hypebanner.show { animation: bannerIn 3.2s cubic-bezier(.2,1.2,.4,1) both; }

  /* ── Gifted subs ──────────────────────────────────────────────── */
  #gift { flex-direction: column; gap: 4vh; visibility: hidden; padding: 4vh 4vw; }
  #gift.go { visibility: visible; }
  .ghead { display: flex; align-items: center; gap: 3vw; opacity: 0; will-change: transform; }
  #gift.go .ghead { animation: dropIn .7s .1s cubic-bezier(.2,1.4,.4,1) both; }
  .gav { position: relative; width: 22vh; height: 22vh; flex: none; }
  .gav img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #111; border: .8vh solid #000; box-shadow: 0 0 0 .7vh var(--accent), 0 0 6vh var(--accent); }
  .gav svg { position: absolute; right: -2.2vh; bottom: -1.4vh; width: 10vh; height: 10vh; filter: drop-shadow(0 .6vh 1vh rgba(0,0,0,.6)); }
  #gift.go .gav svg { animation: wiggle 1.4s 1s ease-in-out infinite; }
  .gtext { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .gname { font-weight: 900; font-size: 9vh; line-height: 1; white-space: nowrap; text-shadow: 0 .6vh 0 rgba(0,0,0,.6); }
  .gwhat { font-family: "Bungee", sans-serif; font-size: 5.5vh; color: var(--accent); text-shadow: 0 0 3vh var(--accent); margin-top: 1vh; letter-spacing: .04em; }
  .gto { font-size: 3.4vh; opacity: 0; letter-spacing: .3em; text-transform: uppercase; }
  #gift.go .gto { animation: fadeUp .5s .7s ease both; }
  .glist { display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: var(--gap, 2vh); max-width: 92vw; }
  .gchip { display: flex; flex-direction: column; align-items: center; gap: 1vh; width: calc(var(--av, 14vh) * 1.5); opacity: 0; will-change: transform, opacity; }
  #gift.go .gchip { animation: chipIn .55s cubic-bezier(.2,1.6,.4,1) both; }
  .gchip img { width: var(--av, 14vh); height: var(--av, 14vh); border-radius: 50%; object-fit: cover; background: #111; border: .5vh solid var(--accent); box-shadow: 0 0 2.5vh color-mix(in srgb, var(--accent) 70%, transparent); }
  .gchip b { font-size: var(--fs, 3vh); font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 .4vh 0 rgba(0,0,0,.6); }
  .gchip.more img { display: none; }
  .gchip.more i { display: flex; align-items: center; justify-content: center; width: var(--av, 14vh); height: var(--av, 14vh); border-radius: 50%; background: rgba(0,0,0,.55); border: .5vh dashed var(--accent);
    font-family: "Bungee", sans-serif; font-style: normal; font-size: calc(var(--av, 14vh) * .3); color: var(--accent); }
  .gbig { font-family: "Bungee", sans-serif; font-size: 22vh; line-height: 1; color: var(--accent); text-shadow: 0 0 6vh var(--accent), 0 1vh 0 rgba(0,0,0,.6); opacity: 0; }
  #gift.go .gbig { animation: popIn .7s .8s cubic-bezier(.2,1.8,.4,1) both; }

  /* ── clip + message ───────────────────────────────────────────── */
  #cliptag { position: absolute; left: 4vw; bottom: 5vh; display: flex; align-items: center; gap: 2vh; padding: 1.5vh 3vh 1.5vh 1.5vh; border-radius: 99px; background: rgba(0,0,0,.7); border: .4vh solid var(--accent); opacity: 0; transform: translateY(4vh); transition: all .5s ease; max-width: 80vw; }
  #cliptag.show { opacity: 1; transform: none; }
  #cliptag img { width: 8vh; height: 8vh; border-radius: 50%; object-fit: cover; }
  #cliptag b { font-size: 3.6vh; display: block; }
  #cliptag span { font-size: 2.6vh; opacity: .85; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }

  #msg { opacity: 0; transform: translateY(6vh); transition: all .6s ease; }
  #msg.show { opacity: 1; transform: none; }
  #msg .bubble { max-width: 75vw; padding: 5vh 6vh; border-radius: 4vh; background: rgba(0,0,0,.65); border: .6vh solid var(--accent); box-shadow: 0 0 6vh var(--accent); text-align: center; }
  #msg .text { font-size: 8vh; font-weight: 900; line-height: 1.1; overflow-wrap: anywhere; }
  #msg .from { margin-top: 2vh; font-size: 3.6vh; color: var(--accent); font-family: "Bungee", sans-serif; }

  #dot { position: absolute; right: 1vw; bottom: 1vh; width: 1vh; height: 1vh; border-radius: 50%; background: #f33; opacity: .6; }
  #dot.ok { background: transparent; }

  /* ── Lite mode: for TV sticks and smart-TV browsers ───────────────
     Same layout and timing, minus the things weak GPUs struggle with:
     blurring a playing video, animated blur / drop-shadow filters, huge
     soft glows and clip-path animations. */
  body.lite .dim, body.lite .dim.deep { filter: none; opacity: 1; }
  body.lite #logo, body.lite #logoimg { transition: none; }
  body.lite .ring, body.lite .portal .rim { box-shadow: 0 0 0 .6vh var(--accent); }
  body.lite .portal .orbit { filter: none; }
  body.lite .portal .orbit.o2 { display: none; }
  body.lite .kicker, body.lite .tape, body.lite .gwhat { text-shadow: none; }
  body.lite .title span { text-shadow: -.6vh 0 #ff2a6d, .6vh 0 #05d9e8; }
  body.lite #raid.go .title span { animation-name: slamLite, none; }
  body.lite #raid.out .wrap { animation-name: collapseLite; }
  body.lite #raid.go .glow { animation: fadein .8s .9s ease both; }
  body.lite .rname, body.lite .rcount b, body.lite .thanks span, body.lite .gbig { text-shadow: 0 .6vh 0 rgba(0,0,0,.6); }
  body.lite #raid.go .rname { animation: slideIn .6s 1.45s cubic-bezier(.2,1.3,.4,1) both; }
  body.lite .fav .halo { box-shadow: none; }
  body.lite .fav .heart, body.lite .gav svg { filter: none; }
  body.lite .gav img { box-shadow: 0 0 0 .7vh var(--accent); }
  body.lite .gchip img { box-shadow: none; }
  body.lite #msg .bubble { box-shadow: none; }
  body.lite #cliptag, body.lite #card { transition-duration: .35s; }
  body.lite .fav .badge { filter: none; }
  body.lite .wtoast, body.lite #hype { box-shadow: none; }
  body.lite #hype .hfill { animation: none; }
  body.lite #hypebanner { text-shadow: 0 .8vh 0 rgba(0,0,0,.6); }
  body.lite #follow.go[data-tier] .tierslam span { animation-name: slamLite; }
  body.lite #follow[data-tier="3"] .tierslam span, body.lite .fav .crown, body.lite .fav .star2, body.lite .crest .sword,
  body.lite .crest .shield svg, body.lite .crest .modbadge, body.lite #gigaimg { filter: none; }
  body.lite .sav .fire { animation: spin 2.2s linear infinite; box-shadow: none; }
  body.lite #follow .beams i:nth-child(2) { display: none; }
  body.lite #mod .slash { box-shadow: none; }
  body.lite #giga .gtext { text-shadow: 0 1vh 0 rgba(0,0,0,.6); }

</style>
</head>
<body>

<script>
const logo = $("logo"), logoImg = $("logoimg"), clip = $("clip"), shade = $("shade");
let logoKind = "video";
let preloading = "";



function setLogo(info) {
  applyMode(info.tv_mode || "auto");
  if (info.theme) {
    const changed = info.theme.id !== THEME.id;
    THEME = info.theme;
    if (changed && !document.querySelector(".layer.go, .layer.show")) setAccent(null);
  }
  document.documentElement.style.setProperty("--fit", info.logo_fit === "contain" ? "contain" : "cover");
  const src = info.logo || "";
  logoKind = info.logo_kind === "image" ? "image" : "video";
  if (logoKind === "image") {
    logo.pause(); logo.removeAttribute("src"); logo.load(); logo.style.display = "none";
    logoImg.style.display = "block";
    if (!logoImg.src.endsWith(src)) logoImg.src = src;
  } else {
    logoImg.style.display = "none"; logoImg.removeAttribute("src");
    logo.style.display = "block";
    if (src && !logo.src.endsWith(src)) { logo.src = src; }
    if (src) logo.play().catch(() => {});
  }
}


// Behind cards: blur the logo on a PC, a cheap black veil in lite mode
function dim(on, deep) {
  if (LITE) {
    shade.style.opacity = on ? (deep ? .86 : .72) : 0;
    return;
  }
  [logo, logoImg].forEach(el => { el.classList.toggle("dim", on); el.classList.toggle("deep", !!deep); });
}

function hideAll() {
  ["card", "msg", "cliptag"].forEach(id => $(id).classList.remove("show"));
  ["raid", "follow", "gift", "streak", "mod", "giga"].forEach(id => $(id).classList.remove("go", "out"));
  document.body.classList.remove("raiding");
}


function unloadClip() {
  clip.onplaying = null; clip.onended = null;
  clip.pause(); clip.removeAttribute("src"); clip.load();
}

function showLogo() {
  clearTimers();
  stopFx();
  hideAll();
  clip.classList.remove("show");
  setTimeout(() => {
    // keep a clip that is being buffered for the next card
    if (!clip.classList.contains("show") && !(preloading && clip.src.endsWith(preloading))) unloadClip();
  }, 700);
  dim(false);
  if (logoKind === "video" && logo.paused && logo.src) logo.play().catch(() => {});
  setAccent(null);
}

/* ── shoutout ─────────────────────────────────────────────────────── */
function playShoutout(ev) {
  const u = ev.user;
  $("avatar").src = avatarSrc(u);
  $("name").textContent = u.display_name;
  $("url").textContent = "twitch.tv/" + u.login;
  $("kicker").textContent = T(ev).kicker ?? "GO FOLLOW";
  $("sub").textContent = T(ev).sub ?? (u.game ? `Last seen playing ${u.game}` : "");
  dim(true);
  $("card").classList.add("show");
  startConfetti(LITE ? 50 : 120);
  later(() => stopFx(), ev.card_seconds * 1000 - 1500);
}

/* ── raid ─────────────────────────────────────────────────────────── */

let portalCenter = null;
function measurePortal() {
  // it may still be scaled to 0 by its entry animation: the centre is right
  // either way, and offsetWidth gives the real (untransformed) size
  const el = $("portal"), p = el.getBoundingClientRect();
  portalCenter = { x: p.left + p.width / 2, y: p.top + p.height / 2, r: el.offsetWidth / 2 };
  return p;
}

function playRaid(ev) {
  const u = ev.user, raid = $("raid");
  const total = ev.card_seconds * 1000;
  $("raidavatar").src = avatarSrc(u);
  $("raidname").textContent = u.display_name;
  $("raidsub").textContent = T(ev).sub ?? (u.game ? `is raiding from ${u.game} with` : "is raiding with");
  const n = ev.viewers, label = T(ev).label || "RAIDERS";
  $("raidnum").textContent = n ? "0" : "";
  $("raidnum").style.display = n ? "" : "none";
  $("raidlabel").textContent = n ? (n === 1 && label === "RAIDERS" ? "RAIDER" : label) : label + " INCOMING";
  // the title slams in letter by letter; a final ! or ? takes the accent colour
  const title = [...(T(ev).title || "RAID!")].slice(0, 12);
  $("raidtitle").innerHTML = title.map((ch, i) => {
    const hl = i === title.length - 1 && /[!?.]/.test(ch) ? ' style="color:var(--accent);' : ' style="';
    return `<span${hl}animation-delay:${(.35 + i * .12).toFixed(2)}s,${(2 + i * .4).toFixed(1)}s">${ch === " " ? "&nbsp;" : esc(ch)}</span>`;
  }).join("");
  $("raidtitle").style.fontSize = title.length > 6 ? (21 * 6 / title.length).toFixed(1) + "vh" : "";
  document.body.classList.add("raiding");
  const strip = Array(8).fill(`<span>${esc("⚠ INCOMING RAID ⚠ " + u.display_name.toUpperCase())}</span>`).join("");
  $("tapeTop").innerHTML = strip + strip;
  $("tapeBot").innerHTML = strip + strip;

  dim(true, true);
  restartAnim(raid);
  fitText($("raidname"), innerWidth * 0.5, 11);
  // Measured once (not every frame): the portal grows from its centre, so
  // the centre is already final. Reading layout per frame is costly on TVs.
  const p = measurePortal(), w = $("raidwrap").getBoundingClientRect();
  raid.style.setProperty("--cx", (p.left + p.width / 2 - (w.left + w.width / 2)) + "px");
  raid.style.setProperty("--cy", (p.top + p.height / 2 - (w.top + w.height / 2)) + "px");
  raid.style.setProperty("--px", (p.left + p.width / 2) / innerWidth * 100 + 20 + "%");
  raid.style.setProperty("--py", (p.top + p.height / 2) / innerHeight * 100 + 20 + "%");
  raidFx(n, total);
  later(() => raid.classList.add("out"), Math.max(total - 900, 2500));
  later(() => stopFx(), total);
}

/* ── follow / sub / resub / bits: one card, different badge + particles ── */
const DEFAULT_TITLES = { follow: "THANKS FOR THE FOLLOW!", sub: "THANKS FOR SUBSCRIBING!", resub: "THANKS FOR RESUBSCRIBING!", bits: "THANKS FOR THE BITS!" };

function playHero(ev) {
  const u = ev.user, f = $("follow"), total = ev.card_seconds * 1000, kind = ev.type;
  const tier = (kind === "sub" || kind === "resub") ? (ev.tier_level || 1) : 1;
  f.dataset.kind = kind;
  if (tier >= 2) f.dataset.tier = tier; else delete f.dataset.tier;
  $("followavatar").src = avatarSrc(u);
  $("followname").textContent = u.display_name;
  renderWords($("thanks"), T(ev).title || DEFAULT_TITLES[kind], tier === 3 ? 1.1 : .35);
  // TIER 2 / TIER 3 slams in letter by letter above the picture
  $("tierslam").innerHTML = tier >= 2 ? [...(T(ev).banner || "TIER " + tier)].slice(0, 14).map((ch, i) =>
    `<span style="animation-delay:${(.15 + i * .09).toFixed(2)}s">${ch === " " ? "&nbsp;" : esc(ch)}</span>`).join("") : "";
  $("herosub").textContent = T(ev).sub || "";
  $("heromsg").textContent = T(ev).message || "";
  if (kind === "bits" || kind === "tiktok_gift") $("gembadge").style.color = gemColor(ev.amount || 1);
  const gift = ev.gift || {};
  if (gift.image) $("giftimg").src = gift.image; else $("giftimg").removeAttribute("src");
  if (kind === "tiktok_gift" && !gift.image) f.dataset.noimg = ""; else delete f.dataset.noimg;
  $("heroplat").textContent = u.platform === "tiktok" ? "TIKTOK" : "";
  $("heroplat").classList.toggle("on", u.platform === "tiktok");
  dim(true);
  restartAnim(f);
  fitText($("followname"), innerWidth * .9, kind === "follow" ? 7 : 6);
  if (kind === "bits" || kind === "tiktok_gift") gemsFx(ev.amount || 100, total);
  else if (kind === "follow") floatsFx(total);
  else if (tier >= 2) celebrateFx(tier, total);
  else { startConfetti(LITE ? 50 : 130); later(() => stopFx(), total - 1200); }
  later(() => f.classList.add("out"), Math.max(total - 600, 1500));
}

/* ── watch streak ─────────────────────────────────────────────────── */
function playStreak(ev) {
  const u = ev.user, s = $("streak"), total = ev.card_seconds * 1000, n = ev.count || 1;
  $("streakavatar").src = avatarSrc(u);
  $("streakname").textContent = u.display_name;
  $("streaksub").textContent = T(ev).sub || "";
  $("streakmsg").textContent = T(ev).message || "";
  // one dot per stream (up to 10), lighting up like a fuse
  const shown = Math.min(n, 10), step = Math.min(.18, 1.4 / shown);
  $("streakdots").innerHTML = Array.from({ length: shown }, (_, i) => `<i style="animation-delay:${(.5 + i * step).toFixed(2)}s"></i>`).join("")
    + (n > shown ? `<b style="animation-delay:${(.5 + shown * step).toFixed(2)}s">+${n - shown}</b>` : "");
  const start = .6 + shown * step;
  renderWords($("streaktitle"), T(ev).title || `${n}-STREAM STREAK!`, start);
  dim(true);
  restartAnim(s);
  fitText($("streakname"), innerWidth * .9, 6);
  tickNumber($("streaktitle").querySelector(".hl"), start * 1000, 900);
  emberFx(total);
  later(() => s.classList.add("out"), Math.max(total - 600, 1500));
}

/* ── modiversary ──────────────────────────────────────────────────── */
function playMod(ev) {
  const u = ev.user, m = $("mod"), total = ev.card_seconds * 1000;
  $("modavatar").src = avatarSrc(u);
  $("modname").textContent = u.display_name;
  $("modsub").textContent = T(ev).sub || "";
  renderWords($("modtitle"), T(ev).title || "THANK YOU, MOD!", 1.3);
  dim(true, true);
  restartAnim(m);
  fitText($("modname"), innerWidth * .9, 6);
  // sparks fly off the slash, then off the swords as they cross
  stopFx(); sizeFx();
  const ang = -24 * Math.PI / 180, cx = W / 2, cy = H / 2;
  const along = Array.from({ length: LITE ? 8 : 18 }, () => { const d = (Math.random() - .5) * W * 1.1; return [cx + Math.cos(ang) * d, cy + Math.sin(ang) * d]; });
  const cr = m.querySelector(".crest").getBoundingClientRect();
  sparksFx([[250, along], [1150, [[cr.left + cr.width / 2, cr.top + cr.height * .42]]]], total);
  later(() => m.classList.add("out"), Math.max(total - 700, 1500));
}

/* ── gigantified emote ────────────────────────────────────────────── */
function playGiga(ev) {
  const u = ev.user, g = $("giga"), total = ev.card_seconds * 1000, e = ev.emote || {};
  const img = $("gigaimg"), name = e.name || "";
  $("gigatext").textContent = name;
  g.classList.toggle("textonly", !e.url);
  img.onerror = () => {
    // no animated version? try the still one, then fall back to the name
    if (e.id && img.src.includes("/default/")) img.src = img.src.replace("/default/", "/static/");
    else if (name) g.classList.add("textonly");
  };
  if (e.url) img.src = e.url; else img.removeAttribute("src");
  $("gigaavatar").src = avatarSrc(u);
  $("gigacap").textContent = T(ev).caption || u.display_name;
  dim(true);
  restartAnim(g);
  if (!e.url) fitText($("gigatext"), innerWidth * .9, 22);
  stopFx(); sizeFx();
  sparksFx([[300, [[W / 2, H * .45]]], [700, [[W / 2, H * .45]]]], total, true);
  later(() => g.classList.add("out"), Math.max(total - 650, 1500));
}

/* ── gifted subs ──────────────────────────────────────────────────── */
function playGift(ev) {
  const u = ev.user, g = $("gift"), total = ev.card_seconds * 1000;
  const people = ev.recipients || [], count = ev.count || people.length || 1;
  $("giftavatar").src = avatarSrc(u);
  $("giftname").textContent = u.display_name;
  $("giftwhat").textContent = T(ev).title || (count === 1 ? "GIFTED A SUB" : `GIFTED ${count.toLocaleString()} SUBS`);
  $("giftto").textContent = T(ev).to ?? "to";
  const list = $("giftlist"), big = $("giftbig");
  if (people.length) {
    const n = people.length;
    // fewer people = bigger faces
    const [av, fs, gap, cap] = n <= 3 ? [20, 4.2, 4, 3] : n <= 6 ? [16, 3.4, 3, 6] : n <= 12 ? [12, 2.8, 2.4, 12]
      : n <= 24 ? [9, 2.3, 1.8, 24] : [7, 2, 1.4, 39];
    list.style.setProperty("--av", av + "vh");
    list.style.setProperty("--fs", fs + "vh");
    list.style.setProperty("--gap", gap + "vh");
    const shown = people.slice(0, n > cap ? cap - 1 : cap);
    const step = Math.min(.14, 2.6 / shown.length);
    list.innerHTML = shown.map((p, i) =>
      `<div class="gchip" style="animation-delay:${(.9 + i * step).toFixed(2)}s"><img src="${esc(avatarSrc(p))}" alt=""><b>${esc(p.display_name)}</b></div>`).join("")
      + (n > shown.length ? `<div class="gchip more" style="animation-delay:${(.9 + shown.length * step).toFixed(2)}s"><i>+${n - shown.length}</i><b>more</b></div>` : "");
    list.style.display = ""; $("giftto").style.display = ""; big.style.display = "none";
  } else {
    list.innerHTML = ""; list.style.display = "none"; $("giftto").style.display = "none";
    big.textContent = "×" + count.toLocaleString(); big.style.display = "";
  }
  dim(true);
  restartAnim(g);
  fitText($("giftname"), innerWidth * .6, 9);
  startConfetti(LITE ? 50 : 140);
  later(() => stopFx(), total - 1200);
  later(() => g.classList.add("out"), Math.max(total - 600, 1500));
}

/* ── canvas effects ───────────────────────────────────────────────── */
const fx = $("fx"), g = fx.getContext("2d");
let fxRun = null, W = 0, H = 0;
// Lite mode draws the effects at half resolution; the browser scales it up.
function sizeFx() {
  const scale = LITE ? .5 : Math.min(devicePixelRatio || 1, 1);
  W = innerWidth; H = innerHeight;
  fx.width = Math.round(W * scale); fx.height = Math.round(H * scale);
  g.setTransform(scale, 0, 0, scale, 0, 0);
}
function stopFx() {
  if (fxRun) cancelAnimationFrame(fxRun);
  fxRun = null;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, fx.width, fx.height);
}

function startConfetti(n) {
  stopFx(); sizeFx();
  const colors = [...(THEME.confetti || []), accent()];
  const bits = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: -Math.random() * H,
    w: 6 + Math.random() * 10, h: 10 + Math.random() * 14,
    vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3,
    r: Math.random() * 6.28, vr: -0.15 + Math.random() * 0.3,
    c: colors[Math.floor(Math.random() * colors.length)]
  }));
  let last = performance.now();
  const tick = now => {
    const k = Math.min((now - last) / 16.7, 3); last = now;   // same speed at 30 or 60 fps
    const s = fx.width / (W || 1);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, fx.width, fx.height);
    for (const b of bits) {
      b.x += b.vx * k; b.y += b.vy * k; b.r += b.vr * k;
      if (b.y > H + 20) { b.y = -20; b.x = Math.random() * W; }
      const cs = Math.cos(b.r) * s, sn = Math.sin(b.r) * s;
      g.setTransform(cs, sn, -sn, cs, b.x * s, b.y * s);
      g.fillStyle = b.c; g.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
    }
    fxRun = requestAnimationFrame(tick);
  };
  fxRun = requestAnimationFrame(tick);
}

// Raid: warp streaks pour out of the portal; one glowing raider per viewer
// (capped) flies in from the screen edges and is swallowed by it.
function raidFx(viewers, total) {
  stopFx(); sizeFx();
  const A = hex6(accent());
  const palette = [A, A, ...(THEME.warp || ["#ffffff", "#ff2a6d", "#05d9e8"])].map(hex6);
  const pick = () => palette[Math.floor(Math.random() * palette.length)];
  const stars = Array.from({ length: LITE ? 70 : 200 }, () => ({ a: Math.random() * 6.283, d: Math.random(), s: .5 + Math.random() * 1.5, c: pick() }));
  const count = Math.min(Math.max(viewers || 40, 24), LITE ? 45 : 160);
  const spanStart = 1700, spanEnd = Math.max(total - 1600, spanStart + 1500);
  const unit = Math.max(H / 1080, .6);
  const raiders = Array.from({ length: count }, () => {
    const side = Math.random() < .5 ? -1 : 1;
    return { born: spanStart + Math.random() * (spanEnd - spanStart), life: 900 + Math.random() * 900,
      side, y0: Math.random() * H, bend: (Math.random() - .5) * H * .9,
      size: (14 + Math.random() * 14) * unit, img: glowSprite(pick()), done: false };
  });
  const trail = LITE ? 0 : 3;
  const num = $("raidnum");
  let pulse = 0, shown = -1, t0 = performance.now(), maxR = Math.hypot(W, H);
  if (!portalCenter) measurePortal();

  const tick = now => {
    const t = now - t0, cx = portalCenter.x, cy = portalCenter.y, R = Math.max(portalCenter.r, 1);
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = "lighter";

    // warp: hard burst at the start, cruise, burst again on exit
    const exitT = total - 900;
    const speed = t < 1300 ? .002 + .022 * Math.sin(Math.min(t / 1300, 1) * Math.PI)
                : t > exitT ? .004 + .03 * Math.min((t - exitT) / 600, 1) : .0045;
    const starAlpha = t < 900 ? t / 900 : 1;
    g.lineCap = "round";
    for (const s of stars) {
      s.d += speed * s.s * (.4 + s.d * 2.5);
      if (s.d > 1) { s.d = .02 + Math.random() * .05; s.a = Math.random() * 6.283; }
      const d1 = R * .9 + s.d * maxR * .7, d0 = R * .9 + Math.max(s.d - speed * s.s * 7, 0) * maxR * .7;
      const ca = Math.cos(s.a), sa = Math.sin(s.a);
      g.strokeStyle = s.c;
      g.globalAlpha = Math.min(1, s.d * 3) * .75 * starAlpha;
      g.lineWidth = 1 + s.d * 3.5;
      g.beginPath(); g.moveTo(cx + ca * d0, cy + sa * d0); g.lineTo(cx + ca * d1, cy + sa * d1); g.stroke();
    }

    // raiders
    for (const p of raiders) {
      if (p.done) continue;
      const k = (t - p.born) / p.life;
      if (k < 0) continue;
      if (k >= 1) { p.done = true; pulse = Math.min(pulse + .35, 1.2); continue; }
      const sx = p.side < 0 ? -30 : W + 30, sy = p.y0;
      const mx = (sx + cx) / 2, my = (sy + cy) / 2 + p.bend;
      for (let j = trail; j >= 0; j--) {
        const e = Math.max(k - j * .035, 0), q = e * e * (3 - 2 * e) * .55 + e * e * .45, iq = 1 - q;
        const x = iq * iq * sx + 2 * iq * q * mx + q * q * cx;
        const y = iq * iq * sy + 2 * iq * q * my + q * q * cy;
        const shrink = Math.max(1 - Math.max(q - .85, 0) / .15, 0);
        const sz = p.size * shrink * (j ? .8 : 1);
        g.globalAlpha = j ? .3 * (trail + 1 - j) / (trail + 1) : 1;
        if (sz > .5) g.drawImage(p.img, x - sz / 2, y - sz / 2, sz, sz);
      }
    }

    // portal swallow pulse
    if (pulse > .02) {
      g.globalAlpha = Math.min(pulse, 1) * .8;
      g.strokeStyle = A; g.lineWidth = 3 + pulse * 6;
      g.beginPath(); g.arc(cx, cy, R * (1.12 + (1.2 - pulse) * .25), 0, 6.283); g.stroke();
      pulse *= .9;
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = "source-over";

    // raider counter ticks up
    if (viewers && t > 1950) {
      const p = Math.min((t - 1950) / 1800, 1), v = Math.round(viewers * (1 - Math.pow(1 - p, 3)));
      if (v !== shown) {
        shown = v; num.textContent = v.toLocaleString();
        if (p >= 1) { num.classList.remove("pop"); void num.offsetWidth; num.classList.add("pop"); }
      }
    }
    fxRun = requestAnimationFrame(tick);
  };
  fxRun = requestAnimationFrame(tick);
}

// Follow: hearts float up from the bottom and sway
function floatsFx(total) {
  stopFx(); sizeFx();
  const cols = [hex6(accent()), ...(THEME.float_colors || ["#ff2a6d", "#ff6fa8", "#ffffff"])];
  const shape = THEME.float || "heart";
  const unit = Math.max(H / 1080, .6);
  const hearts = Array.from({ length: LITE ? 16 : 40 }, () => ({
    // some start already on screen (they fade in), the rest rise from below
    x: Math.random() * W, y: H * .35 + Math.random() * H * 1.1, s: (34 + Math.random() * 46) * unit,
    v: (1.6 + Math.random() * 2.4) * unit, ph: Math.random() * 6.28, img: floatSprite(shape, cols[Math.floor(Math.random() * cols.length)])
  }));
  let last = performance.now(), t0 = last;
  const tick = now => {
    const k = Math.min((now - last) / 16.7, 3); last = now;
    const t = now - t0, fade = t > total - 800 ? Math.max((total - t) / 800, 0) : Math.min(t / 600, 1);
    g.clearRect(0, 0, W, H);
    for (const h of hearts) {
      h.y -= h.v * k; h.ph += .03 * k;
      if (h.y < -h.s) { h.y = H + h.s; h.x = Math.random() * W; }
      g.globalAlpha = .75 * fade * Math.min(1, h.y / (H * .25));
      g.drawImage(h.img, h.x + Math.sin(h.ph) * 22 * unit, h.y, h.s, h.s);
    }
    g.globalAlpha = 1;
    fxRun = requestAnimationFrame(tick);
  };
  fxRun = requestAnimationFrame(tick);
}

// Bits: gems rain down, spinning, more of them for bigger cheers
function gemsFx(amount, total) {
  stopFx(); sizeFx();
  const unit = Math.max(H / 1080, .6);
  const n = Math.round(Math.min(24 + Math.sqrt(amount) * 3, LITE ? 50 : 150));
  // mostly the cheer's own colour, with a few smaller-tier gems mixed in
  const tiers = [1, 100, 1000, 5000, 10000].filter(t => t <= amount);
  const gems = Array.from({ length: n }, () => ({
    // the first gems are already falling when the card appears
    x: Math.random() * W, y: H * .3 - Math.random() * H * 1.1, s: (26 + Math.random() * 34) * unit,
    v: (4 + Math.random() * 5) * unit, sp: .02 + Math.random() * .05, ph: Math.random() * 6.28,
    img: gemSprite(gemColor(Math.random() < .7 ? amount : tiers[Math.floor(Math.random() * tiers.length)]))
  }));
  let last = performance.now(), t0 = last;
  const tick = now => {
    const k = Math.min((now - last) / 16.7, 3); last = now;
    const t = now - t0, fade = t > total - 900 ? Math.max((total - t) / 900, 0) : 1;
    const s = fx.width / (W || 1);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, fx.width, fx.height);
    g.globalAlpha = .95 * fade;
    for (const gm of gems) {
      gm.y += gm.v * k; gm.ph += gm.sp * k;
      if (gm.y > H + gm.s && t < total - 1500) { gm.y = -gm.s - Math.random() * 120; gm.x = Math.random() * W; }
      const flip = Math.cos(gm.ph);             // spins like a coin
      g.setTransform(flip * s, 0, 0, s, gm.x * s, gm.y * s);
      g.drawImage(gm.img, -gm.s / 2, -gm.s / 2, gm.s, gm.s);
    }
    g.globalAlpha = 1;
    fxRun = requestAnimationFrame(tick);
  };
  fxRun = requestAnimationFrame(tick);
}

// Tier 2: confetti cannons from both bottom corners. Tier 3: the cannons
// plus gold coins and gems raining down.
function celebrateFx(tier, total) {
  stopFx(); sizeFx();
  const unit = Math.max(H / 1080, .6);
  const colors = tier === 3 ? ["#ffc93c", "#fff2a8", "#ffffff", "#ff9f1c", accent()] : [...(THEME.confetti || []), "#e4e8ff", "#ffffff", accent()];
  const bits = [];
  const volley = (side) => {
    for (let i = 0; i < (LITE ? 22 : 60); i++) {
      bits.push({ x: side < 0 ? -10 : W + 10, y: H + 10, vx: -side * (5 + Math.random() * 11) * unit, vy: -(16 + Math.random() * 14) * unit,
        w: (8 + Math.random() * 10) * unit, h: (12 + Math.random() * 14) * unit, r: Math.random() * 6.28, vr: -.3 + Math.random() * .6,
        c: colors[Math.floor(Math.random() * colors.length)] });
    }
  };
  const volleys = tier === 3 ? [150, 1100, 2100, 3300] : [200, 1300, 2500];
  volleys.forEach(t => { timers.push(setTimeout(() => { volley(-1); volley(1); }, t)); });
  const rain = tier === 3 ? Array.from({ length: LITE ? 26 : 80 }, () => ({
    x: Math.random() * W, y: -Math.random() * H * 1.2 - 40, s: (34 + Math.random() * 30) * unit, v: (4 + Math.random() * 4.5) * unit,
    sp: .03 + Math.random() * .05, ph: Math.random() * 6.28, img: Math.random() < .7 ? coinSprite() : gemSprite(Math.random() < .5 ? "#ffc93c" : "#ffffff") })) : [];
  let last = performance.now(), t0 = last;
  const tick = now => {
    const k = Math.min((now - last) / 16.7, 3); last = now;
    const t = now - t0, fade = t > total - 900 ? Math.max((total - t) / 900, 0) : 1, s = fx.width / (W || 1);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, fx.width, fx.height);
    g.globalAlpha = fade;
    for (const gm of rain) {
      gm.y += gm.v * k; gm.ph += gm.sp * k;
      if (gm.y > H + gm.s && t < total - 1500) { gm.y = -gm.s - Math.random() * 100; gm.x = Math.random() * W; }
      g.setTransform(Math.cos(gm.ph) * s, 0, 0, s, gm.x * s, gm.y * s);
      g.drawImage(gm.img, -gm.s / 2, -gm.s / 2, gm.s, gm.s);
    }
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.vy += .38 * unit * k; b.vx *= Math.pow(.992, k); b.x += b.vx * k; b.y += b.vy * k; b.r += b.vr * k;
      if (b.y > H + 40 && b.vy > 0) { bits.splice(i, 1); continue; }
      const cs = Math.cos(b.r) * s, sn = Math.sin(b.r) * s;
      g.setTransform(cs, sn, -sn, cs, b.x * s, b.y * s);
      g.fillStyle = b.c; g.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
    }
    g.globalAlpha = 1;
    fxRun = requestAnimationFrame(tick);
  };
  fxRun = requestAnimationFrame(tick);
}

// Watch streak: embers rise from a bed of fire along the bottom
function emberFx(total) {
  stopFx(); sizeFx();
  const unit = Math.max(H / 1080, .6), cols = ["#ff3b00", "#ff6a00", "#ff9500", "#ffb000", "#ffe14d"];
  const embers = Array.from({ length: LITE ? 40 : 110 }, () => ({
    x: Math.random() * W, y: H + Math.random() * H * .6, s: (10 + Math.random() * 26) * unit, v: (1.6 + Math.random() * 3.4) * unit,
    ph: Math.random() * 6.28, life: .5 + Math.random() * .5, img: glowSprite(cols[Math.floor(Math.random() * cols.length)]) }));
  const bedCount = LITE ? 14 : 34;
  const bed = Array.from({ length: bedCount }, (_, i) => ({ x: (i + .5) * W / bedCount, s: (90 + Math.random() * 80) * unit,
    ph: Math.random() * 6.28, img: glowSprite(cols[Math.floor(Math.random() * 3)]) }));
  let last = performance.now(), t0 = last;
  const tick = now => {
    const k = Math.min((now - last) / 16.7, 3); last = now;
    const t = now - t0, fade = t > total - 800 ? Math.max((total - t) / 800, 0) : Math.min(t / 500, 1);
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = "lighter";
    for (const b of bed) {
      b.ph += .12 * k;
      const sz = b.s * (1 + Math.sin(b.ph) * .18);
      g.globalAlpha = .55 * fade;
      g.drawImage(b.img, b.x - sz / 2, H - sz * .55, sz, sz);
    }
    for (const e of embers) {
      e.y -= e.v * k; e.ph += .05 * k;
      const h = 1 - (H - e.y) / (H * e.life * 1.2);
      if (h <= 0) { e.y = H + 10; e.x = Math.random() * W; continue; }
      g.globalAlpha = Math.min(h, 1) * fade;
      const sz = e.s * Math.max(h, .2);
      g.drawImage(e.img, e.x + Math.sin(e.ph) * 18 * unit - sz / 2, e.y - sz / 2, sz, sz);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
    fxRun = requestAnimationFrame(tick);
  };
  fxRun = requestAnimationFrame(tick);
}

// Bursts of sparks: [[delay ms, [[x, y], ...]], ...]. With "keep", a few
// sparkles keep twinkling around the centre afterwards (gigantify).
function sparksFx(bursts, total, keep) {
  const unit = Math.max(H / 1080, .6), cols = [hex6(accent()), "#ffffff", "#ffe14d"];
  const parts = [];
  const t0 = performance.now();
  const pending = bursts.map(([at, points]) => ({ at, points, done: false }));
  let last = t0;
  const tick = now => {
    const k = Math.min((now - last) / 16.7, 3); last = now;
    const t = now - t0;
    for (const b of pending) {
      if (b.done || t < b.at) continue;
      b.done = true;
      for (const [px, py] of b.points) {
        const n = b.points.length > 1 ? (LITE ? 4 : 7) : (LITE ? 30 : 70);
        for (let i = 0; i < n; i++) {
          const a = Math.random() * 6.283, sp = (4 + Math.random() * (b.points.length > 1 ? 9 : 16)) * unit;
          parts.push({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: .012 + Math.random() * .02,
            s: (8 + Math.random() * 18) * unit, img: glowSprite(cols[Math.floor(Math.random() * cols.length)]) });
        }
      }
    }
    if (keep && t > 900 && t < total - 800 && Math.random() < (LITE ? .15 : .4)) {
      const a = Math.random() * 6.283, r = (0.18 + Math.random() * .2) * H;
      parts.push({ x: W / 2 + Math.cos(a) * r * 1.3, y: H * .45 + Math.sin(a) * r, vx: 0, vy: -.6 * unit, life: 1, decay: .02,
        s: (10 + Math.random() * 16) * unit, img: glowSprite(Math.random() < .5 ? "#ffffff" : hex6(accent())) });
    }
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = "lighter";
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vx *= Math.pow(.95, k); p.vy = p.vy * Math.pow(.95, k) + .12 * unit * k;
      p.x += p.vx * k; p.y += p.vy * k; p.life -= p.decay * k;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      g.globalAlpha = p.life;
      g.drawImage(p.img, p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
    fxRun = requestAnimationFrame(tick);
  };
  fxRun = requestAnimationFrame(tick);
}

/* ── clip / message ───────────────────────────────────────────────── */
function preloadClip(src) {
  if (clip.classList.contains("show")) return;
  preloading = src;
  if (!clip.src.endsWith(src)) { clip.src = src; clip.load(); }
}

function playClip(ev) {
  clearTimers(); stopFx(); hideAll();
  setAccent(ev.color);
  dim(true);
  $("tagavatar").src = avatarSrc(ev.user);
  $("tagname").textContent = ev.user.display_name;
  $("tagtitle").textContent = ev.clip.title || "";
  preloading = "";
  if (!clip.src.endsWith(ev.clip.src)) { clip.src = ev.clip.src; clip.load(); }
  clip.muted = PREVIEW || !ev.sound;
  clip.volume = 1;
  // Only fade the clip in once real frames are playing: before that some
  // TV browsers paint a white or grey box.
  let shown = false;
  const reveal = () => {
    if (shown) return; shown = true;
    clip.classList.add("show");
    $("cliptag").classList.add("show");
  };
  clip.onplaying = reveal;
  clip.onended = () => showLogo();
  try { clip.currentTime = 0; } catch (e) {}
  clip.play().catch(() => { clip.muted = true; clip.play().catch(() => {}); });
  later(() => { if (!shown) showLogo(); }, 10000);
}

function showMessage(ev) {
  clearTimers(); stopFx(); hideAll();
  setAccent(ev.color || null);
  $("msgtext").textContent = ev.text;
  $("msgfrom").textContent = ev.from ? "— " + ev.from : "";
  dim(true);
  $("msg").classList.add("show");
  later(() => showLogo(), ev.seconds * 1000);
}

function playEvent(ev) {
  clearTimers(); stopFx(); hideAll();
  if (!clip.classList.contains("show")) preloading = "";
  clip.classList.remove("show");
  setAccent(ev.color);
  if (ev.type === "raid") playRaid(ev);
  else if (["follow", "sub", "resub", "bits", "tiktok_gift"].includes(ev.type)) playHero(ev);
  else if (ev.type === "streak") playStreak(ev);
  else if (ev.type === "modiversary") playMod(ev);
  else if (ev.type === "gigantify") playGiga(ev);
  else if (ev.type === "gift") playGift(ev);
  else playShoutout(ev);
  // the server sends "clip" or "logo" next; this is only a safety net
  later(() => showLogo(), (ev.card_seconds + (ev.clip_pending ? 70 : 4)) * 1000);
}

/* ── text to speech: play it, and show who's being read ───────────── */
function showTts(ev) {
  playTts(ev);
  const box = $("ttsbox");
  box.style.setProperty("--tc", THEME.accent);
  box.classList.remove("on");
  if (ev.show === false) return;
  ttsBubble(box, ev);
  void box.offsetWidth;
  box.classList.add("on");
}
function hideTts() { stopTts(); $("ttsbox").classList.remove("on"); }

/* ── first-time chatter: corner pop-up, independent of the queue ───── */
function showWelcome(ev) {
  const box = $("welcomes");
  while (box.children.length >= 3) box.firstElementChild.remove();      // keep it tidy
  const el = document.createElement("div");
  el.className = "wtoast";
  el.style.setProperty("--wc", "#" + (ev.color || THEME.accent.slice(1)));
  el.innerHTML = `<img alt=""><div><div class="wt"><span class="wave">👋</span> <span class="wtt"></span></div><div class="wn"></div><div class="ws"></div></div>`;
  el.querySelector("img").src = avatarSrc(ev.user);
  el.querySelector(".wtt").textContent = T(ev).title || "Welcome!";
  el.querySelector(".wn").textContent = ev.user.display_name;
  el.querySelector(".ws").textContent = T(ev).sub || "";
  box.appendChild(el);
  setTimeout(() => { el.classList.add("bye"); setTimeout(() => el.remove(), 500); }, (ev.seconds || 7) * 1000);
}

/* ── hype train bar ───────────────────────────────────────────────── */
let hypeBannerTimer = null;
function showHype(ev) {
  const bar = $("hype"), st = ev.state;
  document.documentElement.style.setProperty("--hc", "#" + (ev.color || THEME.accent.slice(1)));
  if (st) {
    $("hypetitle").textContent = st.title || "HYPE TRAIN";
    $("hypelevel").textContent = "LEVEL " + st.level;
    const known = st.percent !== null && st.percent !== undefined;
    bar.classList.toggle("unknown", !known);
    $("hypefill").style.width = known ? st.percent.toFixed(1) + "%" : "100%";
    $("hypepct").textContent = known ? Math.round(st.percent) + "%" : "";
    bar.classList.add("on");
  } else {
    bar.classList.remove("on");
  }
  if (ev.banner && ev.banner.text) {
    const b = $("hypebanner");
    b.textContent = ev.banner.text;
    b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
    clearTimeout(hypeBannerTimer);
    hypeBannerTimer = setTimeout(() => b.classList.remove("show"), 3300);
    if (!document.querySelector(".layer.go, .layer.show") && !fxRun) {
      startConfetti(LITE ? 40 : 100);
      setTimeout(() => { if (!document.querySelector(".layer.go, .layer.show")) stopFx(); }, 3000);
    }
  }
}

function onServer(ev) {
  if (ev.type === "hello" || ev.type === "logo_src") setLogo(ev);
  else if (CARD_TYPES.includes(ev.type)) playEvent(ev);
  else if (ev.type === "welcome") showWelcome(ev);
  else if (ev.type === "hype") showHype(ev);
  else if (ev.type === "clip_preload") preloadClip(ev.src);
  else if (ev.type === "clip") playClip(ev);
  else if (ev.type === "message") showMessage(ev);
  else if (ev.type === "logo") showLogo();
  else if (ev.type === "tts") showTts(ev);
  else if (ev.type === "tts_end") hideTts();
  else if (ev.type === "reload") location.reload();
}

addEventListener("resize", () => { if (fxRun) sizeFx(); if ($("raid").classList.contains("go")) measurePortal(); });
logo.addEventListener("stalled", () => { if (logo.src) logo.load(); });
openSocket("tv", onServer, $("dot"));
</script>
