# Builds the Vibe TV image and publishes it to GitHub's container registry:
#   ghcr.io/ttv-vibesbyvince/vibes-tv:latest   (and :<version>, e.g. :1.3)
# Portainer (or any Docker host) pulls that instead of building locally.
name: Build and publish image

on:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", "requirements.txt", ".github/workflows/docker.yml"]
  workflow_dispatch:            # "Run workflow" button on the Actions tab
  schedule:
    - cron: "17 9 * * 1"        # every Monday: picks up the newest yt-dlp

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -oP '^VERSION = "\K[^"]+' app/server.py)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3      # lets one runner build ARM images too
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=Vibe TV
            org.opencontainers.image.description=Stream TV: logo loop with shoutout, raid, follow, sub, bits and gifted-sub screens for MixItUp
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
