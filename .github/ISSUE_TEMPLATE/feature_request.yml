name: Idea or feature request
description: A new screen, setting or integration you'd like
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/TTV-VibesByVince/Vibes-TV/blob/main/ROADMAP.md) first: if your idea is there, a comment or a 👍 on a matching issue helps decide what comes next.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What should happen on the TV or the settings page, and when?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help your stream
  - type: input
    id: bot
    attributes:
      label: Which bot do you use?
      placeholder: e.g. MixItUp, Streamer.bot
